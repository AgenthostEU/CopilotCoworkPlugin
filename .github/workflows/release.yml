name: Release Cowork package

# Build the Microsoft 365 Copilot Cowork package and publish it as a GitHub
# release asset. Triggers either on a pushed version tag (v*), or manually via
# the Actions "Run workflow" button / API with a tag input — in the manual case
# `gh release create` creates the tag on the checked-out commit automatically.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: echo "value=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: bash scripts/build-m365-package.sh

      - name: Verify archive paths are safe
        run: |
          python3 - <<'PY'
          import zipfile, sys
          z = zipfile.ZipFile("m365/build/agenthost-cowork.zip")
          bad = [n for n in z.namelist()
                 if n.startswith("/") or "\\" in n or ".." in n.split("/")
                 or (len(n) > 1 and n[1] == ":")]
          print("entries:", z.namelist())
          if bad:
              sys.exit(f"unsafe entries: {bad}")
          PY

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.value }}" \
            m365/build/agenthost-cowork.zip \
            --target "${GITHUB_SHA}" \
            --title "agenthost Cowork plugin ${{ steps.tag.outputs.value }}" \
            --notes "Microsoft 365 Copilot Cowork plugin package. Download \`agenthost-cowork.zip\` below.

          **Add it yourself (per user):** in Copilot Cowork open **Customize → Plugins**, choose the upload option, and select \`agenthost-cowork.zip\`. (Your tenant admin must allow custom/uploaded plugins.)

          **Tenant-wide (admin):** Microsoft 365 admin center → **Manage apps** → **Upload custom app** → upload \`agenthost-cowork.zip\`. It then appears for everyone under **Cowork → Customize → Plugins → Discover**.

          Either way, installing prompts the agenthost browser sign-in (OAuth) the first time."
